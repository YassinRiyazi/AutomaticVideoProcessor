Root_Address:     "/run/media/roboprocessing/Data/Samba-Share"
Video_Addresses:  "RobotScientistClips"   # watched input (relative to Root_Address), searched recursively for videos
Output_Address:   "RoboprocessingOutput"  # mirror of Video_Addresses (relative to Root_Address): only CSVs, logs and .done markers

# Working folder (outside the Samba share) for frames and processing detail images, mirroring Video_Addresses.
# When it holds more than max_files files or max_size_gb GB, the least recently processed experiment folders are deleted.
Temporary_Processing:
  address     : "/run/media/roboprocessing/Data/tmp_processing"
  max_files   : 3000000
  max_size_gb : 500
# Daemon mode (python main.py --daemon): watches Root_Address for videos uploaded through Samba
Daemon:
  stability_seconds : 60  # a video is queued only after it has not been written for this many seconds
  poll_interval     : 10  # seconds between scans of Root_Address

# First layer processing parameters
Video: 
  cropping: True # Since we have multi view image we crop 
  cropping_properties_side: 
    WIDTH: 1000
    HEIGHT: 188
    X: 750
    Y: 0 
  cropping_properties_front: 
    WIDTH: 240
    X: 283
    
  Original_image:
    WIDTH: 2048
    HEIGHT: 192
    
single_FolderDropNormalizer:
  Left_boundary_ratio: 0.90
  Right_boundary_ratio: 0.06



image_extension : "*.png"
frame_rate    : 30 # fps video in the folder
frame_folder  : "frames"
rotated_frames_folder : "frames_rotated"
databases_folder : "databases"


# Detection
yolo_conf : 0.6
yolo_name : "Gray-320-s"
extension_yolo : "pt"

Experiment_Parameters:
  fps_experiment: 4000 # fps of the original experiment video # Now in the FrameExtractor we can detect it automatically,
  # TODO: update this value after extracting frames and checking the real fps
  cm_on_pixel_ratio: 0.0039062
  # Front view scale (DropGeometry). Constant approximation: the true front scale changes ~24% along the slide (perspective).
  # 0.0039062 / 0.86, where 0.86 is the median front/side apex-height ratio in tilt-20-rep-001/002. Replace with a direct calibration if available.
  front_cm_on_pixel_ratio: 0.004542
  num_px_ratio: 1 #0.0039062

PreProcessing:
  buttom_Line_height : 5 # pixels

Super_Resolution:
  save_superres   : True
  upscale_factor  : 3
  model_path      : "CaMeasurer/models/converted_model.pt"

Processing_Parameters:
  edge_Detection_threshold : 30